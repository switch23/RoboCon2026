[project]
name = "pidog-jump-rl"
version = "0.1.0"
description = "PiDog jump reinforcement learning environment using MuJoCo, Gymnasium, and PPO"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.4.0",
    "imageio>=2.38.1",
    "mujoco>=3.15.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
